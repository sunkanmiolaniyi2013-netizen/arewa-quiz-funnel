<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <radialGradient id="goldRing" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E5C158"/>
      <stop offset="60%" stop-color="#C59B27"/>
      <stop offset="100%" stop-color="#8F6B12"/>
    </radialGradient>
    <linearGradient id="navyRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A2558"/>
      <stop offset="100%" stop-color="#051535"/>
    </linearGradient>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8F1FC"/>
      <stop offset="100%" stop-color="#CDE0F7"/>
    </linearGradient>
    <path id="textCircleTop" d="M 45,150 A 105,105 0 0,1 255,150" fill="none"/>
    <path id="textCircleBottom" d="M 255,150 A 105,105 0 0,1 45,150" fill="none"/>
  </defs>

  <!-- Outer Braided Gold Border -->
  <circle cx="150" cy="150" r="146" fill="url(#goldRing)" stroke="#7A5B0F" stroke-width="2"/>
  
  <!-- Navy Blue Track for Text -->
  <circle cx="150" cy="150" r="132" fill="url(#navyRing)" stroke="#F3E5AB" stroke-width="2"/>
  
  <!-- Inner Gold Border -->
  <circle cx="150" cy="150" r="96" fill="url(#goldRing)" stroke="#7A5B0F" stroke-width="1.5"/>

  <!-- Inner Center Field -->
  <circle cx="150" cy="150" r="92" fill="url(#skyGrad)"/>

  <!-- Circular Text -->
  <text font-family="'Inter', sans-serif" font-weight="900" font-size="11.5" fill="#FFFFFF" letter-spacing="2">
    <textPath href="#textCircleTop" startOffset="50%" text-anchor="middle">
      NAVAL BUILDING &amp; CONSTRUCTION
    </textPath>
  </text>
  
  <text font-family="'Inter', sans-serif" font-weight="900" font-size="11.5" fill="#FFFFFF" letter-spacing="2.5">
    <textPath href="#textCircleBottom" startOffset="50%" text-anchor="middle">
      COMPANY LIMITED
    </textPath>
  </text>

  <!-- Central Building & Architectural Graphics -->
  <g transform="translate(150, 152) scale(0.85)">
    <!-- Architectural Skyscrapers in center -->
    <rect x="-36" y="-35" width="22" height="48" fill="#1C3879" rx="2"/>
    <rect x="-10" y="-52" width="24" height="65" fill="#0A2558" rx="2"/>
    <rect x="18" y="-28" width="18" height="41" fill="#2C5EAA" rx="2"/>
    
    <!-- Building Windows -->
    <line x1="-28" y1="-28" x2="-28" y2="5" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="2 3"/>
    <line x1="-20" y1="-28" x2="-20" y2="5" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="2 3"/>
    
    <line x1="2" y1="-44" x2="2" y2="5" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="2 3"/>
    <line x1="8" y1="-44" x2="8" y2="5" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="2 3"/>
    
    <line x1="27" y1="-20" x2="27" y2="5" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="2 3"/>

    <!-- Foreground House Roof -->
    <polygon points="-48,15 -18,-10 12,15" fill="#D9483B"/>
    <polygon points="-44,15 -18,-6 8,15" fill="#E85D4E"/>
    <rect x="-38" y="15" width="42" height="22" fill="#FFFFFF" stroke="#0A2558" stroke-width="2"/>
    <rect x="-24" y="24" width="14" height="13" fill="#0A2558"/>
    <rect x="-33" y="19" width="6" height="6" fill="#C59B27"/>

    <!-- Maritime Anchor Element -->
    <g transform="translate(25, -2) scale(0.65)">
      <circle cx="0" cy="-30" r="7" fill="none" stroke="#C59B27" stroke-width="3"/>
      <line x1="0" y1="-23" x2="0" y2="20" stroke="#C59B27" stroke-width="4"/>
      <line x1="-14" y1="-14" x2="14" y2="-14" stroke="#C59B27" stroke-width="3.5"/>
      <path d="M -22,8 C -22,26 22,26 22,8" fill="none" stroke="#C59B27" stroke-width="4" stroke-linecap="round"/>
      <polygon points="-24,6 -18,10 -22,14" fill="#C59B27"/>
      <polygon points="24,6 18,10 22,14" fill="#C59B27"/>
    </g>

    <!-- NBCCL Text Badge at the bottom of the shield -->
    <rect x="-42" y="38" width="84" height="18" fill="#0A2558" rx="4" stroke="#C59B27" stroke-width="1.5"/>
    <text x="0" y="51" font-family="'Inter', sans-serif" font-weight="900" font-size="12" fill="#FFD700" text-anchor="middle" letter-spacing="1.5">
      NBCCL
    </text>
  </g>
</svg>
